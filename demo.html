<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>floweave — Web Component demo</title>
    <style>
      :root {
        --fg: #111827;
        --muted: #6b7280;
        --bg: #f9fafb;
        --panel: #ffffff;
        --border: #e5e7eb;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .layout {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header .subtitle {
        font-size: 13px;
        color: var(--muted);
      }
      .stage {
        display: grid;
        grid-template-columns: 1fr 380px;
        min-height: 0;
      }
      .editor-wrap {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border-right: 1px solid var(--border);
      }
      workflow-editor {
        display: block;
        width: 100%;
        height: 100%;
      }
      aside.controls {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        min-height: 0;
      }
      .controls section {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .controls section:last-child {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .controls h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .controls button {
        display: inline-block;
        padding: 6px 12px;
        margin-right: 8px;
        margin-bottom: 6px;
        font-size: 13px;
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .controls button:hover {
        background: var(--accent-hover);
      }
      pre.snapshot {
        margin: 0;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.4;
        background: #f3f4f6;
        border-radius: 4px;
        max-height: 220px;
        overflow: auto;
      }
      .event-log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
      }
      .event-log li {
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
      }
      .event-log .name {
        font-weight: 600;
      }
      .event-log .name.error {
        color: var(--error);
      }
      .event-log .ts {
        color: var(--muted);
        margin-right: 6px;
      }
      .event-log .detail {
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <h1>floweave</h1>
        <span class="subtitle">
          &lt;workflow-editor&gt; demo · loads dist-wc/workflow-editor.js · expects the LLM proxy on
          http://localhost:3001
        </span>
      </header>

      <div class="stage">
        <div class="editor-wrap">
          <workflow-editor
            id="editor"
            api-endpoint="http://localhost:3001/api/chat"
          ></workflow-editor>
        </div>

        <aside class="controls">
          <section>
            <h2>Programmatic API</h2>
            <button type="button" id="btn-get">getWorkflow()</button>
            <button type="button" id="btn-add">addNode (task)</button>
            <button type="button" id="btn-clear">clear()</button>
          </section>

          <section>
            <h2>Last snapshot</h2>
            <pre class="snapshot" id="snapshot">Click getWorkflow() to capture state.</pre>
          </section>

          <section>
            <h2>CustomEvents</h2>
            <ul class="event-log" id="event-log"></ul>
          </section>
        </aside>
      </div>
    </div>

    <script type="module" src="./dist-wc/workflow-editor.js"></script>
    <script type="module">
      const editor = document.getElementById('editor');
      const log = document.getElementById('event-log');
      const snapshot = document.getElementById('snapshot');

      function appendLog(name, detail, isError) {
        const li = document.createElement('li');
        const ts = new Date().toLocaleTimeString();
        const nameClass = isError ? 'name error' : 'name';
        const detailText =
          typeof detail === 'object' && detail !== null
            ? JSON.stringify(detail, null, 2)
            : String(detail);
        li.innerHTML = `<span class="ts">${ts}</span><span class="${nameClass}">${name}</span><div class="detail"></div>`;
        li.querySelector('.detail').textContent = detailText;
        log.prepend(li);
      }

      // All four CustomEvents from ADR-018.
      editor.addEventListener('workflow-change', (e) => {
        const nodes = Object.keys(e.detail?.nodes ?? {}).length;
        const edges = Object.keys(e.detail?.edges ?? {}).length;
        appendLog('workflow-change', `${nodes} nodes, ${edges} edges`);
      });
      editor.addEventListener('node-selected', (e) => {
        appendLog('node-selected', e.detail ?? '(deselected)');
      });
      editor.addEventListener('chat-message', (e) => {
        const m = e.detail ?? {};
        appendLog('chat-message', `${m.role ?? '?'}: ${m.content ?? ''}`);
      });
      editor.addEventListener('error', (e) => {
        appendLog('error', e.detail ?? 'unknown error', true);
      });

      // Programmatic API buttons.
      document.getElementById('btn-get').addEventListener('click', () => {
        snapshot.textContent = JSON.stringify(editor.getWorkflow(), null, 2);
      });
      document.getElementById('btn-add').addEventListener('click', () => {
        try {
          const id = editor.addNode({
            kind: 'task',
            position: { x: 60 + Math.random() * 200, y: 60 + Math.random() * 200 },
            data: { label: 'Programmatic Task' },
          });
          appendLog('addNode (programmatic)', `new id: ${id}`);
        } catch (err) {
          appendLog('addNode error', err.message, true);
        }
      });
      document.getElementById('btn-clear').addEventListener('click', () => {
        editor.clear();
        snapshot.textContent = 'Cleared.';
      });
    </script>
  </body>
</html>
